<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1628" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Réservation confirmée — Delfosse Properties</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=mob11" />
  <style>
    body.rc{background:#0A1628;color:#F5EDE0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--f-sans)}
    .rc-box{max-width:520px;width:100%;background:#0d1b30;border:1px solid rgba(201,169,97,.28);border-radius:12px;padding:clamp(32px,6vw,52px);text-align:center}
    .rc-mark{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;border:1.5px solid #C9A961;display:flex;align-items:center;justify-content:center}
    .rc-mark svg{width:30px;height:30px;stroke:#D4B77E}
    .rc-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(245,237,224,.6);margin:0 0 10px}
    .rc-title{font-family:var(--f-serif);font-weight:300;font-style:italic;font-size:clamp(30px,5vw,44px);line-height:1.08;margin:0 0 14px;color:#F5EDE0}
    .rc-title em{color:#D4B77E;font-style:italic}
    .rc-lede{color:rgba(245,237,224,.68);font-size:15px;line-height:1.6;margin:0 0 26px}
    .rc-det{border-top:1px solid rgba(201,169,97,.2);border-bottom:1px solid rgba(201,169,97,.2);padding:18px 0;margin:0 0 26px;text-align:left}
    .rc-det .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;color:rgba(245,237,224,.78)}
    .rc-det .row .v{font-family:var(--f-mono);color:#F5EDE0}
    .rc-btn{display:inline-block;text-decoration:none;background:transparent;border:1px solid rgba(201,169,97,.5);color:#F5EDE0;font-size:11px;letter-spacing:.26em;text-transform:uppercase;padding:14px 28px;border-radius:6px;transition:all .25s ease}
    .rc-btn:hover{background:#B69368;border-color:#B69368;color:#0A1628}
    .rc-spin{width:30px;height:30px;border:2px solid rgba(201,169,97,.25);border-top-color:#D4B77E;border-radius:50%;animation:rcSpin .8s linear infinite;margin:0 auto}
    @keyframes rcSpin{to{transform:rotate(360deg)}}
    .rc-muted{color:rgba(245,237,224,.5);font-size:13px;line-height:1.6}
    .rc-lock{margin:0 auto 18px}
    .rc-lock img{width:52px;height:52px;display:block;margin:0 auto 11px}
    .rc-word{font-family:var(--f-serif);color:#F5EDE0;font-size:12px;letter-spacing:5px;text-transform:uppercase}
    .rc-word span{color:#D4B77E}
    .rc-btns{display:flex;flex-direction:column;gap:11px;align-items:center;margin-top:4px}
    .rc-btn{cursor:pointer}
    .rc-btn.gold{background:#B69368;border-color:#B69368;color:#0A1628}
    .rc-btn.gold:hover{background:#C9A961;border-color:#C9A961;color:#0A1628}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="rc">
  <div class="rc-box" id="box">
    <div class="rc-spin"></div>
    <p class="rc-muted" style="margin-top:18px">Confirmation du paiement…</p>
  </div>

  <script>
    (function () {
      var box = document.getElementById('box');
      var sid = new URLSearchParams(location.search).get('session_id');
      function euros(c){return (Number(c||0)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});}
      function fmt(d){if(!d)return'';var p=String(d).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
      function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
      var check = '<div class="rc-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>';
      // Infos par appartement pour le contrat (adresse + n° d'enregistrement meublé de tourisme).
      var APT = {
        '01': { reg:'06088034969WF', addr:'5 rue Barla, 06300 Nice', cap:4 },
        '02': { reg:'06088034969WF', addr:'5 rue Barla, 06300 Nice', cap:4 },
        '03': { reg:'06088033084SB', addr:'27 avenue Notre-Dame, 06000 Nice', cap:6 },
        '04': { reg:'06088034968SB', addr:'38 avenue Auber, 06000 Nice', cap:4 },
        '05': { reg:'', addr:'quartier des Musiciens, Nice', cap:4 },
        '06': { reg:'', addr:'quartier des Musiciens, Nice', cap:4 },
        '07': { reg:'', addr:'quartier des Musiciens, Nice', cap:4 },
        '08': { reg:'06088041847DP', addr:'37 avenue Georges Clemenceau, 06000 Nice', cap:4 }
      };

      if (!sid) { box.innerHTML = fail('Lien invalide.'); return; }

      fetch('/api/booking/confirm/?session_id=' + encodeURIComponent(sid))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.ok && j.status === 'confirmed') {
            var b = j.booking || {};
            box.innerHTML =
              '<div class="rc-lock"><img src="/img/delfosse-icon-white.png" alt="Delfosse Properties" width="52" height="52" /><div class="rc-word">DELFOSSE <span>PROPERTIES</span></div></div>' +
              check +
              '<h1 class="rc-title">Réservation <em>confirmée.</em></h1>' +
              '<p class="rc-lede">Merci ' + esc(b.guest_name || '') + ' ! Votre séjour est réservé. Un e-mail de confirmation vous parvient sous peu.</p>' +
              '<div class="rc-det">' +
                '<div class="row"><span>Appartement</span><span class="v">N° ' + esc(b.apartment_code || '') + '</span></div>' +
                '<div class="row"><span>Arrivée</span><span class="v">' + fmt(b.check_in) + '</span></div>' +
                '<div class="row"><span>Départ</span><span class="v">' + fmt(b.check_out) + '</span></div>' +
                (b.guests_count ? '<div class="row"><span>Voyageurs</span><span class="v">' + esc(b.guests_count) + '</span></div>' : '') +
                (b.total_cents != null ? '<div class="row"><span>Total réglé</span><span class="v">' + euros(b.total_cents) + ' €</span></div>' : '') +
                (b.ref ? '<div class="row"><span>Référence</span><span class="v">' + esc(b.ref) + '</span></div>' : '') +
              '</div>' +
              '<div class="rc-btns">' +
                '<button type="button" class="rc-btn gold" id="pdfBtn">Télécharger la confirmation (PDF)</button>' +
                '<button type="button" class="rc-btn" id="contractBtn">Télécharger le contrat de location (PDF)</button>' +
                '<a class="rc-btn" href="index.html">Retour à l\'accueil</a>' +
              '</div>';
            var pb = document.getElementById('pdfBtn');
            if (pb) pb.addEventListener('click', function(){ genPDF(b); });
            var cb = document.getElementById('contractBtn');
            if (cb) cb.addEventListener('click', function(){ genContract(b); });
          } else if (j.status === 'pending') {
            box.innerHTML = fail('Paiement en cours de validation. Rechargez la page dans un instant.');
          } else {
            box.innerHTML = fail('Nous n\'avons pas pu confirmer automatiquement. Contactez-nous, votre paiement est bien pris en compte.');
          }
        })
        .catch(function () { box.innerHTML = fail('Erreur de connexion. Réessayez.'); });

      function genPDF(b){
        if(!window.jspdf){ return; }
        var btn=document.getElementById('pdfBtn');
        if(btn){ btn.disabled=true; btn.textContent='Génération…'; }
        var img=new Image(); img.crossOrigin='anonymous';
        img.onload=function(){ buildPDF(b,shrink(img)); reset(btn); };
        img.onerror=function(){ buildPDF(b,null); reset(btn); };
        img.src='/img/delfosse-mark.png';
      }
      function shrink(img){
        try{
          var r=img.height/img.width, w=Math.min(320,img.width||320), h=Math.round(w*r);
          var c=document.createElement('canvas'); c.width=w; c.height=h;
          var x=c.getContext('2d'); x.fillStyle='#ffffff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
          return { data:c.toDataURL('image/jpeg',0.92), ratio:r };
        }catch(e){ return null; }
      }
      function reset(btn){ if(btn){ btn.disabled=false; btn.textContent='Télécharger la confirmation (PDF)'; } }
      function buildPDF(b,logo){
        var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
        var W=210, cx=W/2, ink=[26,21,18], muted=[140,127,114]; var y=26;
        if(logo){ var iw=40, ih=iw*logo.ratio; try{ doc.addImage(logo.data,'JPEG',cx-iw/2,y,iw,ih); y+=ih+9; }catch(e){ y+=6; } }
        doc.setFont('times','italic'); doc.setFontSize(24); doc.setTextColor.apply(doc,ink);
        doc.text('Confirmation de réservation', cx, y, {align:'center'}); y+=12;
        doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor.apply(doc,muted);
        doc.text('Merci ' + (b.guest_name||'') + ' — votre séjour est confirmé.', cx, y, {align:'center'}); y+=11;
        doc.setDrawColor(201,169,97); doc.setLineWidth(0.3); doc.line(28,y,W-28,y); y+=11;
        function row(l,v){ doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor.apply(doc,muted); doc.text(l,28,y); doc.setTextColor.apply(doc,ink); doc.text(String(v),W-28,y,{align:'right'}); y+=9; }
        row('Appartement','N° '+(b.apartment_code||''));
        row('Arrivée',fmt(b.check_in));
        row('Départ',fmt(b.check_out));
        if(b.guests_count) row('Voyageurs',b.guests_count);
        if(b.total_cents!=null) row('Total réglé',euros(b.total_cents)+' EUR');
        if(b.deposit_cents) row('Caution (empreinte, non débitée)',euros(b.deposit_cents)+' EUR');
        if(b.ref) row('Référence',b.ref);
        y+=3; doc.line(28,y,W-28,y); y+=12;
        doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor.apply(doc,muted);
        doc.text('La caution est une empreinte bancaire, non débitée sauf dégât constaté.', cx, y, {align:'center'}); y+=5;
        doc.text('Une question ? reservation@delfosseproperties.com', cx, y, {align:'center'});
        doc.setFont('times','normal'); doc.setFontSize(10); doc.setTextColor.apply(doc,ink);
        doc.text('DELFOSSE PROPERTIES', cx, 281, {align:'center'});
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor.apply(doc,muted);
        doc.text('Nice · French Riviera · delfosseproperties.com', cx, 286, {align:'center'});
        doc.save('confirmation-delfosse-'+(b.ref||b.apartment_code||'')+'.pdf');
      }

      function genContract(b){
        if(!window.jspdf){ return; }
        var btn=document.getElementById('contractBtn');
        if(btn){ btn.disabled=true; btn.textContent='Génération…'; }
        var img=new Image(); img.crossOrigin='anonymous';
        img.onload=function(){ buildContract(b,shrink(img)); resetC(btn); };
        img.onerror=function(){ buildContract(b,null); resetC(btn); };
        img.src='/img/delfosse-mark.png';
      }
      function resetC(btn){ if(btn){ btn.disabled=false; btn.textContent='Télécharger le contrat de location (PDF)'; } }
      function buildContract(b,logo){
        var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
        var W=210, L=24, R=W-24, cx=W/2, ink=[26,21,18], muted=[110,100,90], gold=[150,120,70];
        var apt=APT[String(b.apartment_code||'')]||{};
        var y=18;
        if(logo){ var iw=30, ih=iw*logo.ratio; try{ doc.addImage(logo.data,'JPEG',cx-iw/2,y,iw,ih); y+=ih+6; }catch(e){ y+=2; } }
        doc.setFont('times','normal'); doc.setFontSize(12.5); doc.setTextColor.apply(doc,ink);
        doc.text('DELFOSSE PROPERTIES', cx, y, {align:'center'}); y+=9;
        doc.setFont('times','italic'); doc.setFontSize(21); doc.setTextColor.apply(doc,ink);
        doc.text('Contrat de location saisonnière', cx, y, {align:'center'}); y+=6.5;
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor.apply(doc,muted);
        doc.text('Meublé de tourisme — réservation en direct', cx, y, {align:'center'}); y+=7;
        doc.setDrawColor.apply(doc,gold); doc.setLineWidth(0.4); doc.line(L,y,R,y); y+=8;
        function brk(){ if(y>266){ doc.addPage(); y=20; } }
        function h(t){ brk(); doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor.apply(doc,gold); doc.text(t.toUpperCase(),L,y); y+=5; }
        function p(t){ doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor.apply(doc,ink); var lines=doc.splitTextToSize(t,R-L); for(var i=0;i<lines.length;i++){ brk(); if(i<lines.length-1 && lines[i].indexOf(' ')>=0){ doc.text(lines[i],L,y,{maxWidth:R-L,align:'justify'}); } else { doc.text(lines[i],L,y); } y+=4.9; } }
        function sp(n){ y+=(n||3); }
        h('Entre les parties');
        p('Le Loueur : Maxime Delfosse, entrepreneur individuel (loueur en meublé non professionnel), SIRET 893 745 851 00020, 5 rue Barla, 06300 Nice — reservation@delfosseproperties.com. Ci-après « le Loueur ».');
        sp(2);
        p('Le Voyageur : ' + (b.guest_name||'—') + (b.guest_email?(' — '+b.guest_email):'') + '. Ci-après « le Voyageur », responsable du séjour pour l\'ensemble des occupants.');
        sp(4);
        h('Le logement');
        p('Appartement meublé n° ' + (b.apartment_code||'') + (apt.addr?(' — '+apt.addr):'') + '.');
        p('N° d\'enregistrement (meublé de tourisme) : ' + (apt.reg||'[en cours de déclaration]') + '.');
        p('Capacité maximale : ' + (apt.cap||b.guests_count||'') + ' voyageurs. Ce nombre ne peut être dépassé ; tout dépassement non autorisé pourra donner lieu à un supplément par personne et par nuit et/ou à la résiliation immédiate sans remboursement.');
        sp(4);
        h('Le séjour');
        p('Arrivée : ' + fmt(b.check_in) + ' à partir de 16h00. Départ : ' + fmt(b.check_out) + ' avant 11h00.');
        p('Durée : ' + (b.nights||'') + ' nuit(s) — ' + (b.guests_count||'') + ' voyageur(s). Remise des clés : boîtier sécurisé ou conciergerie KeyNest, modalités communiquées par e-mail avant l\'arrivée.');
        sp(4);
        h('État des lieux et inventaire');
        p('Un inventaire du mobilier et des équipements, ainsi que des photographies de référence, sont tenus à la disposition du Voyageur. Le logement est réputé reçu en bon état et conforme à l\'inventaire si le Voyageur ne signale aucune anomalie, par e-mail, dans un délai de trois jours à compter de son arrivée (ou avant son départ si le séjour est plus court). Le Loueur peut établir un état des lieux de sortie ; le Voyageur peut demander qu\'il soit contradictoire.');
        sp(4);
        h('Responsabilité du Voyageur');
        p('Le Voyageur répond des dégradations et des pertes survenues pendant la jouissance du logement, à moins qu\'il ne prouve qu\'elles ont eu lieu sans sa faute (art. 1732 du Code civil). Il répond également des dégradations causées par les personnes qu\'il héberge ou introduit dans les lieux : famille, co-occupants, invités (art. 1735 du Code civil). Une assurance de responsabilité civile villégiature est recommandée.');
        sp(4);
        h('Conditions financières');
        p('Montant total réglé : ' + euros(b.total_cents) + ' EUR (nuitées + frais de ménage + taxe de séjour), encaissé en ligne par carte bancaire via Stripe au moment de la réservation. La taxe de séjour de la Métropole Nice Côte d\'Azur est collectée par le Loueur pour le compte de la collectivité.');
        sp(4);
        h('Caution (dépôt de garantie)');
        p('Un dépôt de garantie de ' + euros(b.deposit_cents) + ' EUR garantit les obligations du Voyageur. Pour les séjours courts, il prend la forme d\'une empreinte bancaire (pré-autorisation) réalisée à l\'approche de l\'arrivée : elle n\'est pas débitée et ne garantit pas l\'encaissement ; il s\'agit d\'un blocage temporaire, débité uniquement en cas de dommage justifié, dans la limite du montant pré-autorisé. Pour les séjours longs, lorsqu\'une empreinte ne peut techniquement couvrir toute la période, le dépôt peut être encaissé puis remboursé, ou l\'empreinte placée peu avant le départ. L\'empreinte (ou le dépôt) est libérée/remboursé au plus tard sous sept jours après le départ en l\'absence de dommage. Le dépôt n\'est pas un plafond : le Voyageur demeure redevable du préjudice qui l\'excède (art. 1231-1 du Code civil). Le Voyageur peut demander communication des justificatifs.');
        sp(4);
        h('Constatation des dommages');
        p('Les dommages sont établis par comparaison entre l\'état d\'entrée et de sortie, à l\'appui de photographies datées et, le cas échéant, d\'un état des lieux contradictoire ou d\'un constat de commissaire de justice. Le Loueur notifie le Voyageur par écrit dans les sept jours suivant le départ, avec justificatifs (devis ou facture). Le Voyageur peut demander ces pièces et contester le montant. Les frais correspondent au coût réel de remise en état, après abattement de la vétusté.');
        sp(4);
        h('Frais en cas de dommage ou de manquement');
        p('Les frais de remise en état sont déduits de la caution sur justificatif (devis ou facture), déduction faite de la vétusté (l\'usure normale n\'est pas à la charge du Voyageur, art. 1755 du Code civil). Les montants ci-dessous sont indicatifs et ne limitent pas le droit du Loueur à la réparation intégrale de son préjudice :');
        p('- Ménage supplémentaire / exceptionnel (état anormal) : frais réels, à partir de 60 EUR');
        p('- Nettoyage et désodorisation (tabac, cannabis ou odeurs persistantes) : frais réels, à titre indicatif ~200 EUR');
        p('- Parquet, carrelage, murs, peintures ou plafonds : remise en état sur devis, déduction de vétusté');
        p('- Mobilier, canapés, matelas, literie ou linge (taches, brûlures, déchirures) : nettoyage ou remplacement, déduction de vétusté');
        p('- Vaisselle, verrerie, petit équipement cassé : coût de remplacement');
        p('- Électroménager ou téléviseur endommagé : coût de remplacement, déduction de vétusté');
        p('- Clés, badges ou télécommandes perdus / changement de serrure si la sécurité l\'exige : coût réel');
        p('- Déchets abandonnés ou objets détériorés : évacuation ou remplacement au coût réel');
        p('- Départ tardif non convenu : indemnité d\'occupation (jusqu\'à une nuitée) et préjudice');
        p('- Dépassement du nombre de voyageurs : supplément par personne et par nuit et/ou résiliation sans remboursement');
        p('- Fête ou événement non autorisé : frais réels de remise en état et préjudice');
        p('Les frais réellement engagés, sur justificatif, prévalent sur ces montants indicatifs. Le Voyageur demeure redevable des dommages excédant le montant de la caution.');
        sp(4);
        h('Annulation');
        p('Annulation par le Voyageur : plus de 14 jours avant l\'arrivée, remboursement intégral des nuitées ; entre 14 et 7 jours, 50 % des nuitées ; moins de 7 jours, nuitées non remboursables. Les frais de ménage et la taxe de séjour sont dans tous les cas intégralement remboursés. En cas de départ anticipé du fait du Voyageur, les nuitées non consommées ne sont pas remboursées (une assurance voyage est recommandée).');
        p('Annulation ou défaillance du fait du Loueur : remboursement intégral de toutes les sommes versées, sans préjudice du droit du Voyageur à réparation. En cas de force majeure, remboursement des sommes correspondant aux nuitées non consommées.');
        sp(4);
        h('Règlement intérieur');
        p('Logement non-fumeur (tabac et cannabis interdits). Animaux non admis sauf accord écrit préalable. Fêtes et événements interdits ; la capacité concerne les personnes qui dorment sur place, pas les visiteurs supplémentaires. Sous-location interdite (art. 1717 du Code civil). Respect du calme entre 22h00 et 8h00, de la jouissance paisible du voisinage et du règlement de copropriété. Le Voyageur trie et évacue les déchets et restitue le logement dans l\'état de remise.');
        sp(4);
        h('Rétractation, identité et conditions générales');
        p('Conformément à l\'article L221-28 12° du Code de la consommation, cette prestation d\'hébergement à dates déterminées n\'ouvre pas de droit de rétractation ; la réservation est ferme dès le paiement. Les voyageurs étrangers renseignent une fiche individuelle de police (art. R814-1 et s. du CESEDA). Toute somme due au titre d\'une pénalité est exigible après mise en demeure restée sans effet, sauf dommage définitivement constaté. Les données personnelles sont traitées uniquement pour gérer le séjour et satisfaire aux obligations légales (voir la Politique de confidentialité sur delfosseproperties.com/politique-confidentialite.html). En cas de litige non résolu, le Voyageur peut recourir gratuitement au médiateur de la consommation compétent. Le présent contrat est régi par les Conditions Générales de Location disponibles sur delfosseproperties.com/cgv, acceptées par le Voyageur lors de la réservation, et par le droit français.');
        sp(4); brk();
        doc.setDrawColor.apply(doc,gold); doc.line(L,y,R,y); y+=6;
        doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor.apply(doc,muted);
        var t=new Date(); var td=('0'+t.getDate()).slice(-2)+'/'+('0'+(t.getMonth()+1)).slice(-2)+'/'+t.getFullYear();
        p('Fait à Nice, le ' + td + '. Contrat accepté par voie électronique lors de la réservation en ligne' + (b.ref?(' (référence ' + b.ref + ')'):'') + '.');
        doc.setFont('times','normal'); doc.setFontSize(9); doc.setTextColor.apply(doc,ink);
        doc.text('DELFOSSE PROPERTIES — Nice, French Riviera', cx, 288, {align:'center'});
        doc.save('contrat-location-delfosse-'+(b.ref||b.apartment_code||'')+'.pdf');
      }

      function fail(msg) {
        return '<p class="rc-eyebrow">Delfosse Properties</p>' +
          '<h1 class="rc-title">Un instant…</h1>' +
          '<p class="rc-lede">' + esc(msg) + '</p>' +
          '<a class="rc-btn" href="index.html">Retour à l\'accueil</a>';
      }
    })();
  </script>
</body>
</html>
