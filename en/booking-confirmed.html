<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A1628" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Booking confirmed — Delfosse Properties</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=mob11" />
  <style>
    body.rc{background:#0A1628;color:#F5EDE0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--f-sans)}
    .rc-box{max-width:520px;width:100%;background:#0d1b30;border:1px solid rgba(201,169,97,.28);border-radius:12px;padding:clamp(32px,6vw,52px);text-align:center}
    .rc-mark{width:64px;height:64px;margin:0 auto 22px;border-radius:50%;border:1.5px solid #C9A961;display:flex;align-items:center;justify-content:center}
    .rc-mark svg{width:30px;height:30px;stroke:#D4B77E}
    .rc-eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(245,237,224,.6);margin:0 0 10px}
    .rc-title{font-family:var(--f-serif);font-weight:300;font-style:italic;font-size:clamp(30px,5vw,44px);line-height:1.08;margin:0 0 14px;color:#F5EDE0}
    .rc-title em{color:#D4B77E;font-style:italic}
    .rc-lede{color:rgba(245,237,224,.68);font-size:15px;line-height:1.6;margin:0 0 26px}
    .rc-det{border-top:1px solid rgba(201,169,97,.2);border-bottom:1px solid rgba(201,169,97,.2);padding:18px 0;margin:0 0 26px;text-align:left}
    .rc-det .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;color:rgba(245,237,224,.78)}
    .rc-det .row .v{font-family:var(--f-mono);color:#F5EDE0}
    .rc-btn{display:inline-block;text-decoration:none;background:transparent;border:1px solid rgba(201,169,97,.5);color:#F5EDE0;font-size:11px;letter-spacing:.26em;text-transform:uppercase;padding:14px 28px;border-radius:6px;transition:all .25s ease}
    .rc-btn:hover{background:#B69368;border-color:#B69368;color:#0A1628}
    .rc-spin{width:30px;height:30px;border:2px solid rgba(201,169,97,.25);border-top-color:#D4B77E;border-radius:50%;animation:rcSpin .8s linear infinite;margin:0 auto}
    @keyframes rcSpin{to{transform:rotate(360deg)}}
    .rc-muted{color:rgba(245,237,224,.5);font-size:13px;line-height:1.6}
    .rc-lock{margin:0 auto 18px}
    .rc-lock img{width:52px;height:52px;display:block;margin:0 auto 11px}
    .rc-word{font-family:var(--f-serif);color:#F5EDE0;font-size:12px;letter-spacing:5px;text-transform:uppercase}
    .rc-word span{color:#D4B77E}
    .rc-btns{display:flex;flex-direction:column;gap:11px;align-items:center;margin-top:4px}
    .rc-btn{cursor:pointer}
    .rc-btn.gold{background:#B69368;border-color:#B69368;color:#0A1628}
    .rc-btn.gold:hover{background:#C9A961;border-color:#C9A961;color:#0A1628}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="rc">
  <div class="rc-box" id="box">
    <div class="rc-spin"></div>
    <p class="rc-muted" style="margin-top:18px">Confirming your payment…</p>
  </div>

  <script>
    (function () {
      var box = document.getElementById('box');
      var sid = new URLSearchParams(location.search).get('session_id');
      function euros(c){return (Number(c||0)/100).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});}
      function fmt(d){if(!d)return'';var p=String(d).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
      function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
      var check = '<div class="rc-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>';

      if (!sid) { box.innerHTML = fail('Invalid link.'); return; }

      fetch('/api/booking/confirm/?session_id=' + encodeURIComponent(sid))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.ok && j.status === 'confirmed') {
            var b = j.booking || {};
            box.innerHTML =
              '<div class="rc-lock"><img src="/img/delfosse-icon-white.png" alt="Delfosse Properties" width="52" height="52" /><div class="rc-word">DELFOSSE <span>PROPERTIES</span></div></div>' +
              check +
              '<h1 class="rc-title">Booking <em>confirmed.</em></h1>' +
              '<p class="rc-lede">Thank you ' + esc(b.guest_name || '') + '! Your stay is booked. A confirmation email is on its way.</p>' +
              '<div class="rc-det">' +
                '<div class="row"><span>Apartment</span><span class="v">No. ' + esc(b.apartment_code || '') + '</span></div>' +
                '<div class="row"><span>Check-in</span><span class="v">' + fmt(b.check_in) + '</span></div>' +
                '<div class="row"><span>Check-out</span><span class="v">' + fmt(b.check_out) + '</span></div>' +
                (b.guests_count ? '<div class="row"><span>Guests</span><span class="v">' + esc(b.guests_count) + '</span></div>' : '') +
                (b.total_cents != null ? '<div class="row"><span>Total paid</span><span class="v">' + euros(b.total_cents) + ' €</span></div>' : '') +
                (b.ref ? '<div class="row"><span>Reference</span><span class="v">' + esc(b.ref) + '</span></div>' : '') +
              '</div>' +
              '<div class="rc-btns">' +
                '<button type="button" class="rc-btn gold" id="pdfBtn">Download confirmation (PDF)</button>' +
                '<a class="rc-btn" href="index.html">Back to home</a>' +
              '</div>';
            var pb = document.getElementById('pdfBtn');
            if (pb) pb.addEventListener('click', function(){ genPDF(b); });
          } else if (j.status === 'pending') {
            box.innerHTML = fail('Payment is being validated. Please reload in a moment.');
          } else {
            box.innerHTML = fail('We could not confirm automatically. Please contact us — your payment has gone through.');
          }
        })
        .catch(function () { box.innerHTML = fail('Connection error. Please try again.'); });

      function genPDF(b){
        if(!window.jspdf){ return; }
        var btn=document.getElementById('pdfBtn');
        if(btn){ btn.disabled=true; btn.textContent='Generating…'; }
        var img=new Image(); img.crossOrigin='anonymous';
        img.onload=function(){ buildPDF(b,shrink(img)); reset(btn); };
        img.onerror=function(){ buildPDF(b,null); reset(btn); };
        img.src='/img/delfosse-mark.png';
      }
      function shrink(img){
        try{
          var r=img.height/img.width, w=Math.min(320,img.width||320), h=Math.round(w*r);
          var c=document.createElement('canvas'); c.width=w; c.height=h;
          var x=c.getContext('2d'); x.fillStyle='#ffffff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
          return { data:c.toDataURL('image/jpeg',0.92), ratio:r };
        }catch(e){ return null; }
      }
      function reset(btn){ if(btn){ btn.disabled=false; btn.textContent='Download confirmation (PDF)'; } }
      function buildPDF(b,logo){
        var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
        var W=210, cx=W/2, ink=[26,21,18], muted=[140,127,114]; var y=26;
        if(logo){ var iw=40, ih=iw*logo.ratio; try{ doc.addImage(logo.data,'JPEG',cx-iw/2,y,iw,ih); y+=ih+9; }catch(e){ y+=6; } }
        doc.setFont('times','italic'); doc.setFontSize(24); doc.setTextColor.apply(doc,ink);
        doc.text('Booking confirmation', cx, y, {align:'center'}); y+=12;
        doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor.apply(doc,muted);
        doc.text('Thank you ' + (b.guest_name||'') + ' — your stay is confirmed.', cx, y, {align:'center'}); y+=11;
        doc.setDrawColor(201,169,97); doc.setLineWidth(0.3); doc.line(28,y,W-28,y); y+=11;
        function row(l,v){ doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor.apply(doc,muted); doc.text(l,28,y); doc.setTextColor.apply(doc,ink); doc.text(String(v),W-28,y,{align:'right'}); y+=9; }
        row('Apartment','No. '+(b.apartment_code||''));
        row('Check-in',fmt(b.check_in));
        row('Check-out',fmt(b.check_out));
        if(b.guests_count) row('Guests',b.guests_count);
        if(b.total_cents!=null) row('Total paid',euros(b.total_cents)+' EUR');
        if(b.deposit_cents) row('Deposit (pre-authorisation, not charged)',euros(b.deposit_cents)+' EUR');
        if(b.ref) row('Reference',b.ref);
        y+=3; doc.line(28,y,W-28,y); y+=12;
        doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor.apply(doc,muted);
        doc.text('The deposit is a card hold, not charged unless damage is noted.', cx, y, {align:'center'}); y+=5;
        doc.text('Any question? reservation@delfosseproperties.com', cx, y, {align:'center'});
        doc.setFont('times','normal'); doc.setFontSize(10); doc.setTextColor.apply(doc,ink);
        doc.text('DELFOSSE PROPERTIES', cx, 281, {align:'center'});
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor.apply(doc,muted);
        doc.text('Nice · French Riviera · delfosseproperties.com', cx, 286, {align:'center'});
        doc.save('booking-delfosse-'+(b.ref||b.apartment_code||'')+'.pdf');
      }

      function fail(msg) {
        return '<p class="rc-eyebrow">Delfosse Properties</p>' +
          '<h1 class="rc-title">One moment…</h1>' +
          '<p class="rc-lede">' + esc(msg) + '</p>' +
          '<a class="rc-btn" href="index.html">Back to home</a>';
      }
    })();
  </script>
</body>
</html>
